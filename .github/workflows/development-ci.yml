name: Rental 独立开发构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rental-development-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZELO_COMMIT: 5a6bbbf7593414a122a060018cb1abd87f1c20bf

jobs:
  development-build:
    if: github.repository == 'JinPen-G/Zelo-rental-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: rental_ci_root_only
          MYSQL_DATABASE: rental_v2_ci
          MYSQL_USER: rental_ci
          MYSQL_PASSWORD: rental_ci_database_only
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - name: 检出待核对的 Rental 提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 检出固定 Zelo 工具和依赖锁
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JinPen-G/Zelo
          ref: ${{ env.ZELO_COMMIT }}
          path: output/.tmp/rental-ci/zelo
          persist-credentials: false
      - name: 固定 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 安装固定底座编译工具
        working-directory: output/.tmp/rental-ci/zelo
        shell: bash
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$GITHUB_WORKSPACE/output/.tmp/rental-ci/npm-cache"
      - name: 从固定双仓源码重建普通开发组合
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/output/.tmp/rental-ci"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$task/zelo" rev-parse HEAD)" = "$ZELO_COMMIT"
          mkdir -p "$task/temporary"
          export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
          export AI_OFFLINE_WRITE_ROOT="$task/temporary" AI_OFFLINE_AUDIT="$task/temporary/audit.log"
          export TEMP="$task/temporary" TMP="$task/temporary" TMPDIR="$task/temporary" XDG_CACHE_HOME="$task/temporary"
          guard="$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs"
          node --no-compilation-cache --max-old-space-size=6144 --require "$guard" \
            tools/prepare-workspace.cjs --framework-repo "$task/zelo" --framework-commit "$ZELO_COMMIT" \
            --repository https://github.com/JinPen-G/Zelo --core-commit "$GITHUB_SHA" \
            --mode development --profile full --out "$task/temporary/full.tgz"
          test ! -e "$AI_OFFLINE_AUDIT"
          mkdir "$task/full"
          tar -xzf "$task/temporary/full.tgz" -C "$task/full"
          (
            cd "$task/full"
            npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          )
          node --no-compilation-cache --max-old-space-size=6144 \
            --require "$guard" scripts/ops/release-rental-development.cjs \
            "$task/zelo" "$ZELO_COMMIT" "$GITHUB_WORKSPACE" "$GITHUB_SHA" --full "$task/full" | tee "$task/build.log"
          test ! -e "$AI_OFFLINE_AUDIT"
          tail -n 1 "$task/build.log" > "$task/development-build.json"
          node -e '
            const report = require(process.argv[1]);
            if (report.format !== "rental-development-build-1" || report.mode !== "development" || report.profile !== "full" ||
                report.dependencyInput !== "full-projection" ||
                report.platform.commit !== process.env.ZELO_COMMIT || report.rental.commit !== process.env.GITHUB_SHA ||
                report.deployment !== "not-prepared" || report.releaseApproved !== false || report.serverUpdateEligible !== false) {
              throw new Error("双仓开发报告身份不一致");
            }
            for (const app of ["tenant-website", "enterprise-portal", "miniprogram", "staff-miniprogram"]) {
              if (!report.projects.some(stage => stage.config === `apps/${app}/tsconfig.json` &&
                stage.roots > 0 && stage.diagnostics === 0)) throw new Error(`缺少四端编译证明：${app}`);
            }
          ' "$task/development-build.json"
      - name: 保留开发构建证明
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rental-development-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/.tmp/rental-ci/development-build.json
          if-no-files-found: error
          retention-days: 7
      - name: 构建同版 full 测试组合并执行原 Rental 回归
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/output/.tmp/rental-ci"
          export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
          export AI_OFFLINE_WRITE_ROOT="$task" AI_OFFLINE_AUDIT="$task/temporary/regression-audit.log"
          export TEMP="$task/temporary" TMP="$task/temporary" TMPDIR="$task/temporary" XDG_CACHE_HOME="$task/temporary"
          guard="$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs"
          node --no-compilation-cache --max-old-space-size=6144 --require "$guard" \
            tools/prepare-workspace.cjs --framework-repo "$task/zelo" --framework-commit "$ZELO_COMMIT" \
            --repository https://github.com/JinPen-G/Zelo --core-commit "$GITHUB_SHA" \
            --mode development --profile full --with-tests --out "$task/temporary/full-tests.tgz"
          mkdir "$task/full-tests"
          tar -xzf "$task/temporary/full-tests.tgz" -C "$task/full-tests"
          cd "$task/full-tests"
          export npm_config_cache="$task/npm-cache"
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          node node_modules/@prisma/engines/scripts/postinstall.js
          prisma_target="$(node -e "require('@prisma/get-platform').getBinaryTargetForCurrentPlatform().then(value => console.log(value))")"
          prisma_library="$(node -e "console.log(require('@prisma/get-platform').getNodeAPIName(process.argv[1], 'fs'))" "$prisma_target")"
          export PRISMA_SCHEMA_ENGINE_BINARY="$PWD/node_modules/@prisma/engines/schema-engine-$prisma_target"
          export PRISMA_QUERY_ENGINE_LIBRARY="$PWD/node_modules/@prisma/engines/$prisma_library"
          test -x "$PRISMA_SCHEMA_ENGINE_BINARY"
          test -s "$PRISMA_QUERY_ENGINE_LIBRARY"
          export PRISMA_GENERATE_SKIP_AUTOINSTALL=1 CHECKPOINT_DISABLE=1
          export NODE_DISABLE_COMPILE_CACHE=1
          export NODE_OPTIONS="--max-old-space-size=6144 --require $guard"
          node scripts/prepare-selected-prisma-schema.cjs --mode rental --output "$PWD/apps/rental-api/prisma-selected"
          node node_modules/prisma/build/index.js generate --schema apps/platform-api/prisma/schema.prisma
          node node_modules/prisma/build/index.js generate --schema apps/rental-api/prisma-selected/schema.prisma
          export RENTAL_PRISMA_CLIENT="$PWD/apps/rental-api/generated/client/index.d.ts"
          npm run build
          test ! -e output/.tmp/rental-lead-participants
          npm run test:rental
          test ! -e output/.tmp/rental-lead-participants
          test ! -e "$AI_OFFLINE_AUDIT"
          # Build the two client applications from this exact development projection.
          # Keep Vite from inheriting the independent repository's parent tsconfig.
          if [ ! -f tsconfig.json ]; then
            printf '{"extends":"./tsconfig.base.json"}\n' > tsconfig.json
          fi
          export NODE_ENV=production RENTAL_ENV_FILE="$task/temporary/web.env" VITE_API_BASE=''
          : > "$RENTAL_ENV_FILE"
          node --input-type=module <<'NODE'
          import { registerHooks } from 'node:module';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const config = pathToFileURL(resolve('packages/platform-admin/config') + '/').href;
          const hook = registerHooks({ resolve(specifier, context, next) {
            return next(context.parentURL?.startsWith(config) && /^\.\/[A-Za-z][A-Za-z0-9-]*$/.test(specifier)
              ? `${specifier}.ts` : specifier, context);
          } });
          try {
            const { build } = await import('vite');
            for (const app of ['tenant-website', 'enterprise-portal']) {
              await build({ root: resolve('apps', app), mode: 'development', build: { manifest: true } });
              console.log(`${app}: Vite 开发投影构建完成`);
            }
          } finally { hook.deregister(); }
          NODE
          test ! -e "$AI_OFFLINE_AUDIT"
      - name: 从同一双仓提交生成 v2 新装包
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/output/.tmp/rental-ci"
          mkdir "$task/fresh"
          export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
          export AI_OFFLINE_WRITE_ROOT="$task/fresh" AI_OFFLINE_AUDIT="$task/fresh/audit.log"
          export TEMP="$task/fresh" TMP="$task/fresh" TMPDIR="$task/fresh" XDG_CACHE_HOME="$task/fresh"
          node --no-compilation-cache --max-old-space-size=6144 \
            --require "$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs" \
            tools/prepare-workspace.cjs --framework-repo "$task/zelo" --framework-commit "$ZELO_COMMIT" \
            --repository https://github.com/JinPen-G/Nativark --core-commit "$GITHUB_SHA" \
            --mode development --profile host --fresh-ai --out "$task/fresh/dependencies.tgz"
          test ! -e "$AI_OFFLINE_AUDIT"
          mkdir "$task/fresh/dependencies"
          tar -xzf "$task/fresh/dependencies.tgz" -C "$task/fresh/dependencies"
          (
            cd "$task/fresh/dependencies"
            npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          )
          node --no-compilation-cache --max-old-space-size=6144 \
            --require "$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs" \
            "$task/zelo/scripts/package-rental-host.cjs" --development --fresh-ai \
            --repo "$task/zelo" --repository https://github.com/JinPen-G/Nativark --commit "$ZELO_COMMIT" \
            --core-repo "$GITHUB_WORKSPACE" --core-commit "$GITHUB_SHA" \
            --deps "$task/fresh/dependencies/node_modules" --output "$task/fresh/host.tgz"
          test ! -e "$AI_OFFLINE_AUDIT"
          mkdir "$task/fresh/host"
          tar -xzf "$task/fresh/host.tgz" -C "$task/fresh/host"
          node - "$task/fresh/host" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.argv[2];
          const read = name => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const receipt = read('rental-host.context.json');
          assert.equal(receipt.installation, 'fresh-ai');
          assert.equal(receipt.sourceMode, 'development');
          assert.equal(receipt.releaseApproved, false);
          assert.equal(receipt.serverUpdateEligible, false);
          const layout = read('development.workspace.json');
          assert.equal(layout.platform.source.commit, process.env.ZELO_COMMIT);
          assert.equal(layout.core.source.commit, process.env.GITHUB_SHA);
          const deployment = path.join(root, 'apps/rental-api/prisma-deployment');
          const lock = read('apps/rental-api/prisma-deployment/core.deployment.lock.json');
          assert.equal(lock.lockVersion, 2);
          assert.deepEqual(lock.base.dataCapabilities.map(entry => entry.id), ['ai-native']);
          assert.equal(lock.postCapability.length, 1);
          const names = fs.readdirSync(path.join(deployment, 'migrations'), { withFileTypes: true })
            .filter(entry => entry.isDirectory()).map(entry => entry.name).sort();
          assert.equal(names.length, 18);
          assert.equal(names.at(-1), 'post-capability.rental.rental.20261127000000-ai-extension');
          assert.ok(fs.statSync(path.join(root, 'apps/rental-api/dist-ai/ai-fresh-main.js')).size > 0);
          assert.ok(fs.statSync(path.join(root, 'apps/rental-api/dist-ai/ai-fresh-initialize.js')).size > 0);
          assert.ok(!fs.existsSync(path.join(root, 'packages/rental-mcp-host')));
          console.log('固定双仓 v2 开发包：18 份原迁移、完整 v2 锁及实际启动入口回读通过；不可发布。');
          NODE
          # Assemble Web as in release-prepare-pair, keeping the tested source projection intact.
          mkdir "$task/fresh/web"
          tar -xzf "$task/fresh/dependencies.tgz" --exclude='packages/rental-core' -C "$task/fresh/web"
          node - "$task/fresh/host" "$task/fresh/web" <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const [host, web] = process.argv.slice(2);
          fs.cpSync(path.join(host, 'packages/rental-core'), path.join(web, 'packages/rental-core'),
            { recursive: true, errorOnExist: true, force: false });
          for (const group of ['apps', 'packages']) {
            for (const entry of fs.readdirSync(path.join(host, group))) {
              if (entry === 'rental-core') continue;
              const directory = path.join(group, entry);
              for (const output of fs.readdirSync(path.join(host, directory), { withFileTypes: true })) {
                if (output.isDirectory() && /^dist(?:-[a-z0-9-]+)?$/.test(output.name)) {
                  fs.cpSync(path.join(host, directory, output.name), path.join(web, directory, output.name),
                    { recursive: true, errorOnExist: true, force: false });
                }
              }
            }
          }
          NODE
          (
            cd "$task/fresh/web"
            if [ ! -f tsconfig.json ]; then
              printf '{"extends":"./tsconfig.base.json"}\n' > tsconfig.json
            fi
            npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
            export CORE_DEPLOYMENT_LOCK="$task/fresh/host/apps/rental-api/prisma-deployment/core.deployment.lock.json"
            export RENTAL_PUBLIC_AI_DATA_PACKAGE_DIR="$task/fresh/host/public-ai-data"
            export RENTAL_ENV_FILE="$task/temporary/web.env" VITE_API_BASE_URL=/api NODE_ENV=production
            node --no-compilation-cache --max-old-space-size=6144 \
              --require "$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs" --input-type=module <<'NODE'
          import { registerHooks } from 'node:module';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const config = pathToFileURL(resolve('packages/platform-admin/config') + '/').href;
          const hook = registerHooks({ resolve(specifier, context, next) {
            return next(context.parentURL?.startsWith(config) && /^\.\/[A-Za-z][A-Za-z0-9-]*$/.test(specifier)
              ? `${specifier}.ts` : specifier, context);
          } });
          try {
            const { build } = await import('vite');
            await build({ root: resolve('apps/rental-admin'), mode: 'rental-fresh-ai', build: { manifest: true } });
          } finally { hook.deregister(); }
          NODE
          )
          test ! -e "$AI_OFFLINE_AUDIT"
          node - "$task" <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path');
          const { createHash } = require('node:crypto');
          const task = process.argv[2], read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const bundles = [];
          for (const [app, directory, mode] of [
            ['tenant-website', 'full-tests', 'development'], ['enterprise-portal', 'full-tests', 'development'],
            ['rental-admin', 'fresh/web', 'rental-fresh-ai'],
          ]) {
            const root = path.join(task, directory), out = path.join(root, 'apps', app, 'dist');
            const source = read(path.join(root, 'development.workspace.json'));
            assert.equal(source.platform.source.commit, process.env.ZELO_COMMIT);
            assert.equal(source.core.source.commit, process.env.GITHUB_SHA);
            const npmLockSha256 = hash(path.join(root, 'package-lock.json'));
            assert.equal(npmLockSha256, source.npmLocks.projected.sha256);
            const manifest = read(path.join(out, '.vite/manifest.json'));
            assert(Object.values(manifest).some(entry => entry.isEntry));
            const files = new Set(['index.html', '.vite/manifest.json']);
            for (const entry of Object.values(manifest)) {
              for (const key of [...(entry.imports ?? []), ...(entry.dynamicImports ?? [])]) assert(manifest[key]);
              for (const file of [entry.file, ...(entry.css ?? []), ...(entry.assets ?? [])]) files.add(file);
            }
            const outputs = [...files].sort().map(file => {
              assert(file && !file.startsWith('/') && !file.split('/').includes('..'));
              assert(fs.statSync(path.join(out, file)).size > 0);
              return [file, hash(path.join(out, file))];
            });
            bundles.push({ app, mode, npmLockSha256, outputs });
          }
          const host = path.join(task, 'fresh/host');
          const deploymentLockSha256 = hash(path.join(host, 'apps/rental-api/prisma-deployment/core.deployment.lock.json'));
          assert.equal(deploymentLockSha256, read(path.join(host, 'rental-host.build-provenance.json')).deploymentLockSha256);
          fs.writeFileSync(path.join(task, 'web-build.json'), JSON.stringify({ platform: process.env.ZELO_COMMIT,
            rental: process.env.GITHUB_SHA, deploymentLockSha256, bundles,
            adminCoreInput: 'fresh-host-standard-package', clientInput: 'full-development-source',
            releaseApproved: false, serverUpdateEligible: false }, null, 2));
          NODE
      - name: 在独立 MySQL 新装 v2 并验证登录重启
        working-directory: output/.tmp/rental-ci/fresh/host
        shell: bash
        env:
          DATABASE_URL: mysql://rental_ci:rental_ci_database_only@127.0.0.1:3306/rental_v2_ci?connection_limit=2
          API_PORT: '3093'
          RENTAL_AI_MODE: enabled
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/output/.tmp/rental-ci/fresh"
          export AUTH_TOKEN_SECRET="$(openssl rand -hex 32)" SEED_PLATFORM_PASSWORD="RentalCi9-$(openssl rand -hex 12)"
          export RENTAL_DEPLOYMENT_LOCK="$PWD/apps/rental-api/prisma-deployment/core.deployment.lock.json"
          export RENTAL_PUBLIC_AI_DATA_PACKAGE_DIR="$PWD/public-ai-data"
          npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          node node_modules/@prisma/engines/scripts/postinstall.js
          prisma=node_modules/prisma/build/index.js
          node "$prisma" generate --schema apps/platform-api/prisma/schema.prisma
          node "$prisma" generate --schema apps/rental-api/prisma-deployment/schema.prisma
          node verify-runtime.cjs
          node "$prisma" migrate deploy --schema apps/rental-api/prisma-deployment/schema.prisma
          node apps/platform-api/dist/initialize.js
          node apps/rental-api/dist-ai/ai-fresh-initialize.js
          entry=apps/rental-api/dist-ai/ai-fresh-main.js
          api_pid=''
          web_pid=''
          cleanup() {
            if [[ -n "$web_pid" ]]; then kill "$web_pid" 2>/dev/null || true; wait "$web_pid" || true; fi
            if [[ -n "$api_pid" ]]; then kill "$api_pid" 2>/dev/null || true; wait "$api_pid" || true; fi
          }
          trap cleanup EXIT
          start() {
            node "$entry" > "$task/api.log" 2>&1 &
            api_pid=$!
            if ! curl -fsS --retry 24 --retry-connrefused --max-time 3 http://127.0.0.1:3093/api/health > /dev/null; then
              tail -n 30 "$task/api.log"
              exit 1
            fi
          }
          start
          export CORE_DEPLOYMENT_LOCK="$RENTAL_DEPLOYMENT_LOCK"
          export RENTAL_ENV_FILE="$task/../temporary/web.env" API_PROXY_TARGET=http://127.0.0.1:3093 VITE_API_BASE_URL=/api
          (
            cd "$task/web"
            exec node --input-type=module <<'NODE'
          import { registerHooks } from 'node:module';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const config = pathToFileURL(resolve('packages/platform-admin/config') + '/').href;
          registerHooks({ resolve(specifier, context, next) {
            return next(context.parentURL?.startsWith(config) && /^\.\/[A-Za-z][A-Za-z0-9-]*$/.test(specifier)
              ? `${specifier}.ts` : specifier, context);
          } });
          const { preview } = await import('vite');
          await preview({ root: resolve('apps/rental-admin'), mode: 'rental-fresh-ai',
            preview: { host: '127.0.0.1', port: 5193, strictPort: true } });
          NODE
          ) > "$task/web.log" 2>&1 &
          web_pid=$!
          if ! curl -fsS --retry 15 --retry-delay 1 --retry-connrefused --max-time 3 http://127.0.0.1:5193/api/health > /dev/null; then
            tail -n 30 "$task/web.log"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { resolve } from 'node:path';
          const web = 'http://127.0.0.1:5193', out = resolve('../web/apps/rental-admin/dist');
          const login = await fetch(web + '/login', { signal: AbortSignal.timeout(8000) });
          assert.equal(login.status, 200);
          const html = await login.text();
          assert.equal(html, fs.readFileSync(resolve(out, 'index.html'), 'utf8'));
          const entry = /<script\b[^>]*\bsrc="(\/assets\/[^"/]+\.js)"/.exec(html)?.[1];
          const styles = [...html.matchAll(/<link\b[^>]*\bhref="(\/assets\/[^"/]+\.css)"/g)].map(match => match[1]);
          assert(entry && styles.length > 0, '后台缺少编译后的 JS/CSS 入口');
          for (const file of [entry, ...styles]) {
            const asset = await fetch(web + file, { signal: AbortSignal.timeout(8000) });
            assert.equal(asset.status, 200);
            assert.match(asset.headers.get('content-type') ?? '', file.endsWith('.js') ? /javascript/ : /css/);
            assert.deepEqual(Buffer.from(await asset.arrayBuffer()), fs.readFileSync(resolve(out, '.' + file)));
          }
          for (const base of ['http://127.0.0.1:3093/api', web + '/api']) {
            const response = await fetch(base + '/auth/login', { method: 'POST', signal: AbortSignal.timeout(10000),
              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                tenantCode: 'platform', account: 'admin', password: process.env.SEED_PLATFORM_PASSWORD
              }) });
            assert.equal(response.status, 201);
            const result = await response.json();
            const session = result.data ?? result;
            assert.ok(session.accessToken);
            const me = await fetch(base + '/auth/session-context', { signal: AbortSignal.timeout(8000),
              headers: { Authorization: `Bearer ${session.accessToken}` } });
            assert.equal(me.status, 200);
            const body = await me.json();
            assert.equal((body.data ?? body).tenant.tenantCode, 'platform');
          }
          console.log('v2 原权限和真实会话：通过');
          fs.writeFileSync(resolve('../../web-http.json'), JSON.stringify({ platform: process.env.ZELO_COMMIT,
            rental: process.env.GITHUB_SHA, loginHtml: true, entryAssets: [entry, ...styles],
            directAndProxiedLogin: true, directAndProxiedSession: true, browserExecuted: false }, null, 2));
          NODE
          kill "$api_pid"
          wait "$api_pid" || code=$?
          api_pid=''
          test "${code:-0}" -eq 0 || test "$code" -eq 143
          start
          node "$prisma" migrate status --schema apps/rental-api/prisma-deployment/schema.prisma
          curl -fsS --max-time 5 http://127.0.0.1:3093/api/health > /dev/null
          curl -fsS --max-time 5 http://127.0.0.1:5193/api/health > /dev/null
          echo 'v2 固定宿主使用原 18 条迁移账重启成功。'
      - name: 保留 Web 构建与 HTTP 验证证明
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rental-web-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/.tmp/rental-ci/web-build.json
            output/.tmp/rental-ci/web-http.json
          if-no-files-found: error
          retention-days: 7

  multi-core-development-build:
    if: github.repository == 'JinPen-G/Zelo-rental-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出待核对的 Rental 提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 检出固定 Zelo 工具和依赖锁
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JinPen-G/Zelo
          ref: ${{ env.ZELO_COMMIT }}
          path: output/.tmp/rental-multi-core-ci/zelo
          persist-credentials: false
      - name: 固定 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: 安装固定编译依赖
        working-directory: output/.tmp/rental-multi-core-ci/zelo
        shell: bash
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$GITHUB_WORKSPACE/output/.tmp/rental-multi-core-ci/npm-cache"
      - name: 从同一双仓提交编译普通双 Core 宿主
        shell: bash
        run: |
          set -euo pipefail
          task="$GITHUB_WORKSPACE/output/.tmp/rental-multi-core-ci"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$task/zelo" rev-parse HEAD)" = "$ZELO_COMMIT"
          temporary="$task/temporary"
          mkdir "$temporary"
          export DATABASE_URL=mysql://offline:offline@127.0.0.1:1/rental_os_offline
          export AI_OFFLINE_WRITE_ROOT="$temporary" AI_OFFLINE_AUDIT="$temporary/audit.log"
          export TEMP="$temporary" TMP="$temporary" TMPDIR="$temporary" XDG_CACHE_HOME="$temporary"
          node --no-compilation-cache --max-old-space-size=6144 \
            --require "$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs" \
            tools/prepare-workspace.cjs --framework-repo "$task/zelo" --framework-commit "$ZELO_COMMIT" \
            --repository https://github.com/JinPen-G/Zelo --core-commit "$GITHUB_SHA" \
            --mode development --profile multi-core --out "$temporary/multi-core.tgz"
          test ! -e "$AI_OFFLINE_AUDIT"
          mkdir "$task/multi-core"
          tar -xzf "$temporary/multi-core.tgz" -C "$task/multi-core"
          (
            cd "$task/multi-core"
            npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$task/npm-cache"
          )
          node --no-compilation-cache --max-old-space-size=6144 \
            --require "$task/zelo/tests/fixtures/ai-native/prisma-offline-preload.cjs" \
            scripts/ops/release-rental-development.cjs \
            "$task/zelo" "$ZELO_COMMIT" "$GITHUB_WORKSPACE" "$GITHUB_SHA" --multi-core "$task/multi-core" | tee "$temporary/build.log"
          test ! -e "$AI_OFFLINE_AUDIT"
          tail -n 1 "$temporary/build.log" > "$task/multi-core-development-build.json"
          node - "$task/multi-core-development-build.json" <<'NODE'
          const assert = require('node:assert/strict');
          const report = require(process.argv[2]);
          assert.equal(report.format, 'rental-multi-core-development-build-1');
          assert.equal(report.mode, 'development');
          assert.equal(report.profile, 'multi-core');
          assert.equal(report.dependencyInput, 'multi-core-projection');
          assert.equal(report.host, 'example-multi-core');
          assert.deepEqual(report.coreIds, ['rental', 'example-tickets']);
          assert.equal(report.platform.commit, process.env.ZELO_COMMIT);
          assert.equal(report.rental.commit, process.env.GITHUB_SHA);
          assert.ok(report.projects.some(stage => stage.config === 'apps/example-multi-core-api/tsconfig.json' &&
            stage.diagnostics === 0 && stage.outputs > 0));
          assert.ok(report.projects.some(stage => stage.config === 'apps/example-multi-core-admin/tsconfig.json' &&
            stage.diagnostics === 0 && stage.roots > 0));
          assert.equal(report.deployment, 'not-prepared');
          assert.equal(report.releaseApproved, false);
          assert.equal(report.serverUpdateEligible, false);
          assert.equal(report.databaseChecked, false);
          NODE
      - name: 保留普通双 Core 开发构建证明
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rental-multi-core-development-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/.tmp/rental-multi-core-ci/multi-core-development-build.json
          if-no-files-found: error
          retention-days: 7
